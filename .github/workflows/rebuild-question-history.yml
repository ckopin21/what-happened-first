name: Rebuild global question history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-question-history.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild generated global history
        run: node work/build-global-history.js
      - name: Commit generated history when changed
        run: |
          if git diff --quiet -- packs/history/used-questions.json; then
            echo "Global history is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packs/history/used-questions.json
          git commit -m "Rebuild global question history"
          git push
