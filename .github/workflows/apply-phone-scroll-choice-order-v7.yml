name: Apply phone scroll and choice randomization v7
on:
  push:
    branches: [main]
    paths:
      - 'work/apply-phone-scroll-choice-order-v7.py'
      - '.github/workflows/apply-phone-scroll-choice-order-v7.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply fixes
        run: python work/apply-phone-scroll-choice-order-v7.py
      - name: Audit timeline mode
        run: node work/audit-game.js outputs/dog-jeopardy.html
      - name: Audit Classic mode
        run: node work/audit-classic.js
      - name: Verify concrete fixes
        run: |
          grep -q 'PHONE_SCROLL_CHOICE_FIX_V7' outputs/dog-jeopardy.html
          grep -q 'primaryCorrectSideBag' outputs/dog-jeopardy.html
          grep -q 'buildPrimaryChoiceOrder' outputs/dog-jeopardy.html
          grep -q 'overflow-y:auto!important' outputs/dog-jeopardy.html
      - name: Commit finished fixes
        run: |
          rm work/apply-phone-scroll-choice-order-v7.py
          rm .github/workflows/apply-phone-scroll-choice-order-v7.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/dog-jeopardy.html work/audit-game.js work/apply-phone-scroll-choice-order-v7.py .github/workflows/apply-phone-scroll-choice-order-v7.yml
          git commit -m 'Fix phone scrolling and randomize answer sides'
          git push origin main
