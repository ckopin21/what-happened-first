name: Deploy validated GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'outputs/**'
      - 'packs/**'
      - 'assets/**'
      - 'work/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node work/validate-packs.js
      - run: node work/validate-questions.js
      - run: node work/audit-game.js outputs/dog-jeopardy.html
      - run: node work/audit-classic.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
