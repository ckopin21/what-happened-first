name: Apply phone follow scroll v8

on:
  push:
    branches: [main]
    paths:
      - 'work/apply-phone-follow-scroll-v8.py'
      - '.github/workflows/apply-phone-follow-scroll-v8.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply phone follow-up scroll fix
        run: python work/apply-phone-follow-scroll-v8.py
      - name: Audit timeline mode
        run: node work/audit-game.js outputs/dog-jeopardy.html
      - name: Audit Classic mode
        run: node work/audit-classic.js
      - name: Verify fix markers
        run: |
          grep -q 'PHONE_FOLLOW_SCROLL_FIX_V8' outputs/dog-jeopardy.html
          grep -q 'scrollIntoView({behavior:"smooth",block:"nearest"})' outputs/dog-jeopardy.html
      - name: Commit finished fix
        run: |
          rm work/apply-phone-follow-scroll-v8.py
          rm .github/workflows/apply-phone-follow-scroll-v8.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/dog-jeopardy.html work/apply-phone-follow-scroll-v8.py .github/workflows/apply-phone-follow-scroll-v8.yml
          git commit -m 'Fix phone follow-up scrolling and answer visibility'
          git push
