name: Apply gameplay v3 fixes

on:
  push:
    branches: [main]
    paths:
      - 'work/apply-gameplay-v3.py'
      - 'work/finish-gameplay-v3.py'
      - '.github/workflows/apply-gameplay-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Complete patch script
        run: python work/finish-gameplay-v3.py
      - name: Apply gameplay fixes
        run: python work/apply-gameplay-v3.py
      - name: Audit timeline mode
        run: node work/audit-game.js outputs/dog-jeopardy.html
      - name: Audit Classic mode
        run: node work/audit-classic.js
      - name: Commit finished changes
        run: |
          rm -f work/apply-gameplay-v3.py work/finish-gameplay-v3.py .github/workflows/apply-gameplay-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix follow-ups, avatars, Classic daily doubles, and phone join" || exit 0
          git push
