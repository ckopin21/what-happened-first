name: Apply timeline v4 fixes
on:
  push:
    branches: [main]
    paths:
      - 'work/apply-timeline-v4.py'
      - '.github/workflows/apply-timeline-v4.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply timeline patch
        run: python work/apply-timeline-v4.py
      - name: Audit timeline
        run: node work/audit-game.js outputs/dog-jeopardy.html
      - name: Commit finished timeline fixes
        run: |
          rm -f work/apply-timeline-v4.py .github/workflows/apply-timeline-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix timeline follow-up choices and avatar framing" || exit 0
          git push
