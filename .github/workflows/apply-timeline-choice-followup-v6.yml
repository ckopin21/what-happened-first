name: Apply timeline choice and follow-up v6

on:
  push:
    branches: [main]
    paths:
      - 'work/apply-timeline-choice-followup-v6.py'
      - '.github/workflows/apply-timeline-choice-followup-v6.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply timeline fixes
        run: python work/apply-timeline-choice-followup-v6.py
      - name: Audit timeline mode
        run: node work/audit-game.js outputs/dog-jeopardy.html
      - name: Audit Classic mode
        run: node work/audit-classic.js
      - name: Verify timeline changes
        run: |
          grep -q 'function shuffledPrimaryChoices' outputs/dog-jeopardy.html
          grep -q 'choiceOrder:Array.isArray(current.choiceOrder)' outputs/dog-jeopardy.html
          grep -q 'broadcastGameState(true);' outputs/dog-jeopardy.html
      - name: Commit finished fixes
        run: |
          rm -f work/apply-timeline-choice-followup-v6.py .github/workflows/apply-timeline-choice-followup-v6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore timeline follow-ups and randomize primary choices" || exit 0
          git push
