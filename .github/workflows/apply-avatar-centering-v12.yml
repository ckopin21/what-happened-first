name: Apply avatar centering v12
on:
  push:
    branches: [main]
    paths:
      - 'work/apply-avatar-centering-v12.js'
      - '.github/workflows/apply-avatar-centering-v12.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Center Timeline avatars
        run: node work/apply-avatar-centering-v12.js
      - name: Audit Timeline mode
        run: node work/audit-game.js outputs/dog-jeopardy.html
      - name: Audit Classic mode
        run: node work/audit-classic.js
      - name: Verify avatar centering
        run: |
          grep -q 'AVATAR_CENTERING_V12' outputs/dog-jeopardy.html
          ! grep -q 'AVATAR_CROP_V5' outputs/dog-jeopardy.html
          grep -q 'object-fit:contain!important' outputs/dog-jeopardy.html
      - name: Commit finished fix
        run: |
          rm work/apply-avatar-centering-v12.js
          rm .github/workflows/apply-avatar-centering-v12.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/dog-jeopardy.html work/audit-game.js work/apply-avatar-centering-v12.js .github/workflows/apply-avatar-centering-v12.yml
          git commit -m 'Center timeline avatar artwork'
          git push
