name: Apply phone reconnect and follow-up confirmation v10
on:
  push:
    branches: [main]
    paths:
      - 'work/apply-phone-reconnect-follow-confirm-v10.js'
      - '.github/workflows/apply-phone-reconnect-follow-confirm-v10.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply phone reconnect and confirmation fix
        run: node work/apply-phone-reconnect-follow-confirm-v10.js
      - name: Audit timeline mode
        run: node work/audit-game.js outputs/dog-jeopardy.html
      - name: Audit Classic mode
        run: node work/audit-classic.js
      - name: Verify new behavior markers
        run: |
          grep -q 'phoneConfirmFollowup' outputs/dog-jeopardy.html
          grep -q 'remoteRecoveryReady' outputs/dog-jeopardy.html
          grep -q 'resume-ok' outputs/dog-jeopardy.html
          grep -q 'whf-phone-profile:' outputs/dog-jeopardy.html
      - name: Commit finished fix
        run: |
          rm work/apply-phone-reconnect-follow-confirm-v10.js
          rm .github/workflows/apply-phone-reconnect-follow-confirm-v10.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/dog-jeopardy.html work/apply-phone-reconnect-follow-confirm-v10.js .github/workflows/apply-phone-reconnect-follow-confirm-v10.yml
          git commit -m 'Confirm follow-up answers and restore phone sessions'
          git push
