name: Audit games

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'outputs/**'
      - 'packs/**'
      - 'assets/**'
      - 'work/**'
      - '.github/workflows/audit-games.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'outputs/**'
      - 'packs/**'
      - 'assets/**'
      - 'work/**'
      - '.github/workflows/audit-games.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JSON question packs
        run: node work/validate-packs.js
      - name: Audit timeline mode
        run: node work/audit-game.js outputs/dog-jeopardy.html
      - name: Audit classic mode
        run: node work/audit-classic.js
      - name: Audit responsive UI layout
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          python3 -m http.server 4173 >/tmp/whf-layout-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node work/audit-layout.js http://127.0.0.1:4173/outputs
