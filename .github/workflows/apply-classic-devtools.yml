name: Apply Classic developer tools

on:
  push:
    paths:
      - 'work/apply-classic-devtools.js'
      - '.github/workflows/apply-classic-devtools.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: node work/apply-classic-devtools.js
      - name: Audit timeline mode
        run: node work/audit-game.js outputs/dog-jeopardy.html
      - name: Audit Classic mode
        run: node work/audit-classic.js
      - name: Commit finished changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm work/apply-classic-devtools.js .github/workflows/apply-classic-devtools.yml
          git add -A
          git commit -m "Add Classic developer tools and fullscreen exit"
          git push
