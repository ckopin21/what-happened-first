name: Apply Classic parity v2

on:
  push:
    branches: [main]
    paths:
      - 'work/apply-classic-parity-v2.py'
      - '.github/workflows/apply-classic-parity-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python work/apply-classic-parity-v2.py
      - name: Audit timeline mode
        run: node work/audit-game.js outputs/dog-jeopardy.html
      - name: Audit Classic mode
        run: node work/audit-classic.js
      - name: Commit finished changes
        run: |
          rm -f work/apply-classic-parity-v2.py .github/workflows/apply-classic-parity-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/classic-jeopardy.html work/audit-classic.js work/apply-classic-parity-v2.py .github/workflows/apply-classic-parity-v2.yml
          git commit -m "Complete Classic host controls and phone layout" || exit 0
          git push
