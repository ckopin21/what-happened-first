name: Apply Classic v4 fixes
on:
  push:
    branches: [main]
    paths:
      - 'work/apply-classic-v4.py'
      - '.github/workflows/apply-classic-v4.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix phone matcher in patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('work/apply-classic-v4.py')
          s=p.read_text(encoding='utf-8')
          old="rx(r'function initPhone\\(room\\)\\{.*?\\n\\}\\n\\n\\nfunction setDeveloperMode',"
          new="rx(r'function initPhone\\(room\\)\\{.*?\\n\\}\\s*function setDeveloperMode',"
          if old not in s:
              raise SystemExit('initPhone matcher not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply Classic patch
        run: python work/apply-classic-v4.py
      - name: Audit timeline mode
        run: node work/audit-game.js outputs/dog-jeopardy.html
      - name: Audit Classic mode
        run: node work/audit-classic.js
      - name: Commit finished fixes and cleanup
        run: |
          rm -f work/apply-classic-v4.py .github/workflows/apply-classic-v4.yml
          rm -f work/apply-gameplay-v3.py work/finish-gameplay-v3.py .github/workflows/apply-gameplay-v3.yml
          rm -f work/apply-timeline-v4.py .github/workflows/apply-timeline-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Classic daily doubles, two-part clues, and phone joining" || exit 0
          git push
