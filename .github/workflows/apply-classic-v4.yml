name: Apply Classic v4 fixes
on:
  push:
    branches: [main]
    paths:
      - 'work/apply-classic-v4.py'
      - '.github/workflows/apply-classic-v4.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Classic patch
        id: patch
        run: |
          set +e
          python work/apply-classic-v4.py > /tmp/classic-patch.txt 2>&1
          status=$?
          cat /tmp/classic-patch.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: classic-v4-diagnostics
          path: /tmp/classic-patch.txt
      - name: Stop on patch failure
        if: steps.patch.outputs.status != '0'
        run: exit 1
      - name: Audit timeline mode
        run: node work/audit-game.js outputs/dog-jeopardy.html
      - name: Audit Classic mode
        run: node work/audit-classic.js
      - name: Commit finished fixes and cleanup
        run: |
          rm -f work/apply-classic-v4.py .github/workflows/apply-classic-v4.yml
          rm -f work/apply-gameplay-v3.py work/finish-gameplay-v3.py .github/workflows/apply-gameplay-v3.yml
          rm -f work/apply-timeline-v4.py .github/workflows/apply-timeline-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Classic daily doubles, two-part clues, and phone joining" || exit 0
          git push
