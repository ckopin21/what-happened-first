name: One-time avatar replacement

on:
  push:
    paths:
      - 'work/one-time-replace-avatars-svg.py'
      - '.github/workflows/one-time-avatar-replacement.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-avatars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace avatar artwork
        run: python3 work/one-time-replace-avatars-svg.py
      - name: Audit timeline game
        run: node work/audit-game.js
      - name: Audit classic game
        run: node work/audit-classic.js
      - name: Commit replacement and remove one-time files
        run: |
          rm -f work/one-time-replace-avatars-svg.py .github/workflows/one-time-avatar-replacement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/dog-jeopardy.html work/one-time-replace-avatars-svg.py .github/workflows/one-time-avatar-replacement.yml
          git commit -m "Replace avatars with centered artwork"
          git push

# rerun after audit marker update
