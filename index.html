<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jeopardy Game Modes</title>
<script>
const phoneParams=new URLSearchParams(location.search);
if(phoneParams.has("phone")){
  const routes={timeline:"outputs/dog-jeopardy.html",classic:"outputs/classic-jeopardy.html",standard:"outputs/standard-jeopardy.html"};
  const target=routes[phoneParams.get("mode")];
  if(target) location.replace(target+location.search+location.hash);
  else location.replace("index.html?mode-error=1");
}
</script>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}body{min-height:100dvh;background:radial-gradient(circle at top,#14577d 0,#071b2c 45%,#030c13 100%);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}.wrap{width:min(900px,100%);text-align:center}.title{font-size:clamp(42px,8vw,76px);font-weight:1000;color:#ffd166;text-shadow:0 5px 0 rgba(0,0,0,.28);margin:0}.sub{color:#cfe5f3;font-weight:800;margin:8px 0 28px}.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.mode{display:block;text-decoration:none;color:white;text-align:left;padding:24px;border-radius:22px;border:3px solid rgba(255,255,255,.78);background:linear-gradient(160deg,#176b9e,#0b304b);box-shadow:0 18px 42px rgba(0,0,0,.38);transition:.18s transform,.18s filter}.mode:hover{transform:translateY(-4px);filter:brightness(1.08)}.mode h2{margin:0 0 8px;color:#ffd166;font-size:30px}.mode p{margin:0;color:#d8e9f4;line-height:1.45;font-weight:700}.tag{display:inline-block;margin-top:16px;border-radius:999px;padding:7px 10px;background:rgba(255,255,255,.12);font-size:12px;font-weight:900}@media(max-width:680px){.modes{grid-template-columns:1fr}.mode{text-align:center}}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="title">JEOPARDY</h1>
  <div class="sub" id="modeSub">Choose a game mode.</div>
  <section class="modes">
    <a class="mode" href="outputs/dog-jeopardy.html">
      <h2>What Happened First?</h2>
      <p>Timeline trivia. The active player chooses and answers between two events.</p>
      <span class="tag">Original mode</span>
    </a>
    <a class="mode" href="outputs/classic-jeopardy.html">
      <h2>Classic Jeopardy</h2>
      <p>The chooser picks the clue, then every player types and submits an answer at the same time.</p>
      <span class="tag">Open-ended answers</span>
    </a>
  </section>
</main>
<script>if(new URLSearchParams(location.search).has("mode-error"))document.getElementById("modeSub").textContent="That phone link uses an unknown game mode. Ask the host to scan a new QR code.";</script>
</body>
</html>
